# Render's free tier sleeps after ~15 minutes idle and then takes roughly 50
# seconds to wake. During judging that reads as a broken app: the scan hangs,
# and nobody waits. This pings the health endpoint often enough to keep the
# instance up.
#
# Set BACKEND_URL as a repository variable (Settings > Secrets and variables >
# Actions > Variables), e.g. https://snapclaim-server.onrender.com
name: keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BACKEND_URL }}"
          if [ -z "$URL" ]; then echo "BACKEND_URL not set; skipping."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL/health" || echo 000)
          echo "GET $URL/health -> $code"
          [ "$code" = "200" ] || exit 1
